# The packaging branches, and pipelines run by hand from the web page
workflow:
    rules:
        - if: $CI_COMMIT_BRANCH =~ /^gitlab-ci(-dev)?$/
        - if: $CI_COMMIT_TAG
        - if: $CI_PIPELINE_SOURCE == "web"

stages:
    - source
    - build
    - test

variables:
    DEBIAN_FRONTEND: noninteractive
    # the address of Maintainer in debian/control, for the changelog
    DEBEMAIL: Marco Giusti <marco.giusti@posteo.de>

# The upstream tarball, the same for every distribution: the sdist, which
# has what MANIFEST.in lists and nothing else of the checkout.
source:
    stage: source
    image: debian:trixie
    script:
        # the pictures are in Git LFS: a checkout without them has pointers
        # in their place, which the package would install as pictures
        - |
            if grep -rlI --include='*.png' '^version https://git-lfs' .; then
                echo "pictures of Git LFS missing: pointers in their place"
                exit 1
            fi
        - apt-get update
        - apt-get install -y --no-install-recommends python3-build python3-setuptools
        - python3 -m build --sdist --no-isolation --outdir sdist .
    artifacts:
        paths:
            - sdist/*

.build-template: &build-deb
    stage: build
    needs: [source]
    before_script:
        - apt-get update
        # the build dependencies, those of debian/control
        - apt-get build-dep -y --no-install-recommends ./
        - apt-get install -y --no-install-recommends devscripts
        # pyproject.toml needs setuptools 77 or newer, with packaging 24.2 or
        # newer, which Ubuntu 24.04 doesn't have (68.1 and 24.0): there the
        # build takes them from PyPI
        - >-
            python3 -c 'import setuptools, sys; sys.exit(int(setuptools.__version__.split(".")[0]) < 77)'
            || { apt-get install -y --no-install-recommends python3-pip && pip3 install --break-system-packages --ignore-installed 'setuptools>=77' 'packaging>=24.2'; }
        - export VB_VERSION="$(python3 -c 'import virtualbricks; print(virtualbricks.__version__)')"
        # a pre-release, as 3.0.0.dev8, comes before its release: 3.0.0~dev8
        - export VB_UPSTREAM_VERSION="$(echo "$VB_VERSION" | sed -E 's/\.?(dev|a|b|rc)([0-9]+)$/~\1\2/')"
        - export "VB_DEB_VERSION=${VB_UPSTREAM_VERSION}-0~${DISTRIBUTION}1"
        - mkdir dist
        # the sources of the package: the upstream tarball, and debian/
        - cp sdist/virtualbricks-*.tar.gz ../virtualbricks_"$VB_UPSTREAM_VERSION".orig.tar.gz
        - mkdir ../virtualbricks-"$VB_UPSTREAM_VERSION"
        - tar -xzf ../virtualbricks_"$VB_UPSTREAM_VERSION".orig.tar.gz --strip-components=1 -C ../virtualbricks-"$VB_UPSTREAM_VERSION"
        - cp -R debian ../virtualbricks-"$VB_UPSTREAM_VERSION"/
        - cd ../virtualbricks-"$VB_UPSTREAM_VERSION"
    script:
        - debchange --newversion "$VB_DEB_VERSION" "New upstream version"
        - debchange --release --distribution "${DISTRIBUTION}" ""
        # not signed: the repository checks no signature of the uploads, and
        # signs its Release files with its own key
        - dpkg-buildpackage --no-sign
        - cp ../virtualbricks_"$VB_UPSTREAM_VERSION".orig.tar.gz ../virtualbricks_"$VB_DEB_VERSION"* "$CI_PROJECT_DIR"/dist/
    artifacts:
        paths:
            - dist/*

# The checks of Debian on the upload of Debian 13: an error or a warning
# fails the job.
lintian:
    stage: test
    image: debian:trixie
    needs: [debian-13]
    script:
        - apt-get update
        - apt-get install -y --no-install-recommends lintian
        - lintian --fail-on error,warning --info dist/*.changes

# Debian 13, trixie
debian-13:
    <<: *build-deb
    image: debian:trixie
    variables:
      DISTRIBUTION: trixie

# Debian 14, forky
debian-14:
    <<: *build-deb
    image: debian:forky
    variables:
      DISTRIBUTION: forky

# Debian unstable, sid
debian-sid:
    <<: *build-deb
    image: debian:sid
    variables:
      DISTRIBUTION: sid

# Ubuntu 24.04 LTS, noble
ubuntu-24.04:
    <<: *build-deb
    image: ubuntu:noble
    variables:
      DISTRIBUTION: noble

# Ubuntu 26.04, resolute
ubuntu-26.04:
    <<: *build-deb
    image: ubuntu:resolute
    variables:
      DISTRIBUTION: resolute
