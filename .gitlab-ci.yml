stages:
    - source
    - build
    - test

variables:
    DEBIAN_FRONTEND: noninteractive
    # the address of Maintainer in debian/control, for the changelog
    DEBEMAIL: Marco Giusti <marco.giusti@posteo.de>

# The upstream tarball, the same for every distribution: the sdist, which
# has what MANIFEST.in lists and nothing else of the checkout.
source:
    stage: source
    image: debian:trixie
    script:
        - apt-get update
        - apt-get install -y python3-build python3-setuptools
        - python3 -m build --sdist --no-isolation --outdir sdist .
    artifacts:
        paths:
            - sdist/*

.build-template: &build-deb
    stage: build
    needs: [source]
    before_script:
        - apt-get update
        # install download-secure-file to be able to access the secure files in .secure_files/
        - apt-get install -y curl gpg
        - curl --silent https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
        # Import the GnuPG key necessary to sign the changes file.
        - gpg --import .secure_files/public.key
        - gpg --import .secure_files/private.key
        # the key is in the keyring now: nothing else reads the file
        - rm -rf .secure_files
        # dpkg-buildpackage signs with this key, whatever the address of the
        # changelog
        - |
            export DEB_SIGN_KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" {print $10; exit}')"
        # install the build dependencies
        - apt-get install -y build-essential debhelper devscripts dh-python python3-all python3-setuptools pybuild-plugin-pyproject
        # pyproject.toml needs setuptools 77 or newer, with packaging 24.2 or
        # newer, which Ubuntu 24.04 doesn't have (68.1 and 24.0): there the
        # build takes them from PyPI
        - >-
            python3 -c 'import setuptools, sys; sys.exit(int(setuptools.__version__.split(".")[0]) < 77)'
            || { apt-get install -y python3-pip && pip3 install --break-system-packages --ignore-installed 'setuptools>=77' 'packaging>=24.2'; }
        - export VB_VERSION="$(python3 -c 'import virtualbricks; print(virtualbricks.__version__)')"
        # a pre-release, as 3.0.0.dev8, comes before its release: 3.0.0~dev8
        - export VB_UPSTREAM_VERSION="$(echo "$VB_VERSION" | sed -E 's/\.?(dev|a|b|rc)([0-9]+)$/~\1\2/')"
        - export "VB_DEB_VERSION=${VB_UPSTREAM_VERSION}-0~${DISTRIBUTION}1"
        - mkdir dist
        # the sources of the package: the upstream tarball, and debian/
        - cp sdist/virtualbricks-*.tar.gz ../virtualbricks_"$VB_UPSTREAM_VERSION".orig.tar.gz
        - mkdir ../virtualbricks-"$VB_UPSTREAM_VERSION"
        - tar -xzf ../virtualbricks_"$VB_UPSTREAM_VERSION".orig.tar.gz --strip-components=1 -C ../virtualbricks-"$VB_UPSTREAM_VERSION"
        - cp -R debian ../virtualbricks-"$VB_UPSTREAM_VERSION"/
        - cd ../virtualbricks-"$VB_UPSTREAM_VERSION"
    script:
        - debchange --newversion "$VB_DEB_VERSION" "New upstream version"
        - debchange --release --distribution "${DISTRIBUTION}" ""
        - dpkg-buildpackage
        - cp ../virtualbricks_"$VB_UPSTREAM_VERSION".orig.tar.gz ../virtualbricks_"$VB_DEB_VERSION"* "$CI_PROJECT_DIR"/dist/
    artifacts:
        paths:
            - dist/*

# The package built for a distribution, in a container of it. As a user
# that isn't root (as root, the tests that expect a permission error fail):
# the unit tests of the sources, on the libraries of the distribution, as
# tools/targetsuite.py runs them, without the package; then, the package
# installed, its console and its windows.
.test-template: &test-deb
    stage: test
    script:
        - apt-get update
        # vde-netemu is in the repository of the packages, not in the
        # distributions: an empty package stands for it
        - mkdir -p vde-netemu/DEBIAN
        - |
            cat > vde-netemu/DEBIAN/control <<'EOF'
            Package: vde-netemu
            Version: 0
            Architecture: all
            Maintainer: CI <ci@localhost>
            Description: vde-netemu for the tests
            EOF
        - dpkg-deb --build vde-netemu vde-netemu.deb
        # what the tests use besides: xvfb for the windows, openssl for the
        # certificates, bsdtar for the archives
        - apt-get install -y --no-install-recommends ./vde-netemu.deb vde2-cryptcab xvfb xauth openssl libarchive-tools
        - apt-get satisfy -y --no-install-recommends "$(dpkg-deb -f dist/virtualbricks_*_all.deb Depends)"
        - useradd -m tester
        - |
            cat > /tmp/unit.sh <<'EOF'
            set -eu
            export HOME=/home/tester LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1
            cd "$1"
            xvfb-run -a timeout 1800 python3 -m twisted.trial -j4 \
                --temp-directory "$(mktemp -d)/trial" virtualbricks < /dev/null
            EOF
        - |
            cat > /tmp/package.sh <<'EOF'
            set -eu
            export HOME=/home/tester LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            cd "$HOME"
            echo "the console makes a switch"
            status=0
            printf 'brick new switch\nbrick list\nquit\n' |
                timeout 60 virtualbricks --no-gui --workspace "$HOME/workspace" > console.log 2>&1 || status=$?
            cat console.log
            test "$status" = 0
            awk '$1 == "sw1" && $2 == "Switch" {found = 1} END {exit !found}' console.log
            echo "the windows open, and are still open after 15 s"
            status=0
            xvfb-run -a timeout 15 virtualbricks --no-term < /dev/null > gui.log 2>&1 || status=$?
            cat gui.log
            test "$status" = 124
            if grep -q Traceback gui.log; then exit 1; fi
            EOF
        # a failure of the unit tests fails the job at its end, after the
        # package was tried too
        - runuser -u tester -- sh /tmp/unit.sh "$CI_PROJECT_DIR" || unit=$?
        - apt-get install -y --no-install-recommends ./dist/virtualbricks_*_all.deb
        - runuser -u tester -- sh /tmp/package.sh
        - test "${unit:-0}" = 0

# Debian 13, trixie
debian-13:
    <<: *build-deb
    image: debian:trixie
    variables:
      DISTRIBUTION: trixie

test-debian-13:
    <<: *test-deb
    image: debian:trixie
    needs: [debian-13]

# Debian 14, forky
debian-14:
    <<: *build-deb
    image: debian:forky
    variables:
      DISTRIBUTION: forky

test-debian-14:
    <<: *test-deb
    image: debian:forky
    needs: [debian-14]

# Debian unstable, sid
debian-sid:
    <<: *build-deb
    image: debian:sid
    variables:
      DISTRIBUTION: sid

test-debian-sid:
    <<: *test-deb
    image: debian:sid
    needs: [debian-sid]

# Ubuntu 24.04 LTS, noble
ubuntu-24.04:
    <<: *build-deb
    image: ubuntu:noble
    variables:
      DISTRIBUTION: noble

test-ubuntu-24.04:
    <<: *test-deb
    image: ubuntu:noble
    needs: [ubuntu-24.04]

# Ubuntu 26.04, resolute
ubuntu-26.04:
    <<: *build-deb
    image: ubuntu:resolute
    variables:
      DISTRIBUTION: resolute

test-ubuntu-26.04:
    <<: *test-deb
    image: ubuntu:resolute
    needs: [ubuntu-26.04]
