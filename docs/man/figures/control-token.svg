<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 272" role="img" aria-label="The client and Virtualbricks each prove that they know the token: Virtualbricks sends its nonce S; the client sends its nonce C and the HMAC of &#x27;virtualbricks client S C&#x27; under the token, which Virtualbricks checks; then Virtualbricks sends the HMAC of &#x27;virtualbricks server S C&#x27;, which the client checks. A wrong proof closes the connection."><defs><marker id="tk-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip"/></marker><marker id="tk-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-accent"/></marker><marker id="tk-warn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-warn"/></marker></defs><rect x="115" y="16" width="110" height="34" rx="6" class="box"/><text x="170" y="38" text-anchor="middle" class="title">client</text><line x1="170" y1="50" x2="170" y2="260" class="life"/><rect x="468" y="16" width="145" height="34" rx="6" class="box"/><text x="540" y="38" text-anchor="middle" class="title">Virtualbricks</text><line x1="540" y1="50" x2="540" y2="260" class="life"/><text x="355" y="91" text-anchor="middle" class="mono">nonce S</text><line x1="536" y1="100" x2="174" y2="100" class="ln-warn" marker-end="url(#tk-warn)"/><text x="355" y="137" text-anchor="middle" class="mono">nonce C,</text><text x="355" y="153" text-anchor="middle" class="mono">HMAC(token, &quot;virtualbricks client S C&quot;)</text><line x1="174" y1="162" x2="536" y2="162" class="ln-warn" marker-end="url(#tk-warn)"/><text x="554" y="170" class="small muted">checks it: if wrong,</text><text x="554" y="185" class="small muted">closes the connection</text><text x="355" y="213" text-anchor="middle" class="mono">HMAC(token, &quot;virtualbricks server S C&quot;)</text><line x1="536" y1="222" x2="174" y2="222" class="ln-warn" marker-end="url(#tk-warn)"/><text x="156" y="230" text-anchor="end" class="small muted">checks it: if wrong,</text><text x="156" y="245" text-anchor="end" class="small muted">closes the connection</text></svg>
