<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 300" role="img" aria-label="The three protocols: JSON, lines of JSON on a socket of protocol=json; AMP 1 and AMP 2 over AMP boxes, on an AMP socket, the default, where Hello with protocols [2] takes a connection from protocol 1 to protocol 2. Under both, the proof of the token when the socket asks for it, and a unix, tcp or ssl socket of --listen."><defs><marker id="ly-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip"/></marker><marker id="ly-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-accent"/></marker><marker id="ly-warn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-warn"/></marker></defs><rect x="20" y="16" width="200" height="104" rx="7" class="box-accent"/><text x="120" y="44" text-anchor="middle" class="title">JSON</text><text x="120" y="66" text-anchor="middle" class="small">a line of the console,</text><text x="120" y="83" text-anchor="middle" class="small">the lines it prints</text><text x="120" y="106" text-anchor="middle" class="small muted">protocol 1 of the greeting</text><rect x="250" y="16" width="170" height="104" rx="7" class="box-accent"/><text x="335" y="44" text-anchor="middle" class="title">AMP 1</text><text x="335" y="66" text-anchor="middle" class="small">Hello, who answers</text><text x="335" y="83" text-anchor="middle" class="small">Run, a line and its lines</text><text x="335" y="106" text-anchor="middle" class="small muted">without Hello, too</text><rect x="500" y="16" width="240" height="104" rx="7" class="box-accent"/><text x="620" y="44" text-anchor="middle" class="title">AMP 2</text><text x="620" y="66" text-anchor="middle" class="small">a typed command for each</text><text x="620" y="83" text-anchor="middle" class="small">command of the console</text><text x="620" y="106" text-anchor="middle" class="small muted">Follow and its pushes, Attach</text><line x1="424" y1="68" x2="496" y2="68" class="ln-accent" marker-end="url(#ly-acc)"/><text x="460" y="58" text-anchor="middle" class="mono small t-accent">Hello</text><text x="460" y="86" text-anchor="middle" class="mono small t-accent">[2]</text><rect x="20" y="130" width="200" height="44" rx="7" class="box-ghost"/><text x="120" y="157" text-anchor="middle" class="small">the token, if asked</text><rect x="250" y="130" width="490" height="44" rx="7" class="box-ghost"/><text x="495" y="157" text-anchor="middle" class="small">the token, if asked: Challenge, Authenticate</text><rect x="20" y="184" width="200" height="40" rx="7" class="box"/><text x="120" y="209" text-anchor="middle" class="mono">JSON lines</text><rect x="250" y="184" width="490" height="40" rx="7" class="box"/><text x="495" y="209" text-anchor="middle" class="mono">AMP boxes</text><rect x="20" y="234" width="720" height="40" rx="7" class="box"/><text x="380" y="259" text-anchor="middle" class="mono">a unix, tcp or ssl socket of --listen</text><text x="120" y="292" text-anchor="middle" class="mono small muted">protocol=json</text><text x="495" y="292" text-anchor="middle" class="mono small muted">protocol=amp, the default</text></svg>
