<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 526" role="img" aria-label="A session over AMP: on a socket that asks for the token, Challenge and Authenticate first; then Hello with protocols 1 and 2, answered with protocol 2; then Run, a command of protocol 1, and BrickStart, a typed command of protocol 2, each answered with its lines."><defs><marker id="am-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip"/></marker><marker id="am-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-accent"/></marker><marker id="am-warn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-warn"/></marker></defs><rect x="115" y="16" width="110" height="34" rx="6" class="box"/><text x="170" y="38" text-anchor="middle" class="title">program</text><line x1="170" y1="50" x2="170" y2="514" class="life"/><rect x="468" y="16" width="145" height="34" rx="6" class="box"/><text x="540" y="38" text-anchor="middle" class="title">Virtualbricks</text><line x1="540" y1="50" x2="540" y2="514" class="life"/><text x="355" y="91" text-anchor="middle" class="mono">Challenge</text><line x1="174" y1="100" x2="536" y2="100" class="ln-warn" marker-end="url(#am-warn)"/><text x="554" y="108" class="small muted">on a socket that asks</text><text x="554" y="123" class="small muted">for the token</text><text x="355" y="145" text-anchor="middle" class="mono">nonce S</text><line x1="536" y1="154" x2="174" y2="154" class="ln-warn" marker-end="url(#am-warn)"/><text x="355" y="185" text-anchor="middle" class="mono">Authenticate nonce C, proof</text><line x1="174" y1="194" x2="536" y2="194" class="ln-warn" marker-end="url(#am-warn)"/><text x="355" y="225" text-anchor="middle" class="mono">proof of Virtualbricks</text><line x1="536" y1="234" x2="174" y2="234" class="ln-warn" marker-end="url(#am-warn)"/><text x="355" y="273" text-anchor="middle" class="mono">Hello protocols [1, 2]</text><line x1="174" y1="282" x2="536" y2="282" class="ln" marker-end="url(#am-tip)"/><text x="355" y="313" text-anchor="middle" class="mono">protocol 2, version, pid, project</text><line x1="536" y1="322" x2="174" y2="322" class="ln-accent" marker-end="url(#am-acc)"/><text x="554" y="330" class="small muted">agreed on 2</text><text x="355" y="361" text-anchor="middle" class="mono">Run line &quot;brick start sw1&quot;</text><line x1="174" y1="370" x2="536" y2="370" class="ln" marker-end="url(#am-tip)"/><text x="554" y="378" class="small muted">protocol 1</text><text x="355" y="401" text-anchor="middle" class="mono">lines [...]</text><line x1="536" y1="410" x2="174" y2="410" class="ln-accent" marker-end="url(#am-acc)"/><text x="355" y="441" text-anchor="middle" class="mono">BrickStart name [&quot;vm1&quot;]</text><line x1="174" y1="450" x2="536" y2="450" class="ln" marker-end="url(#am-tip)"/><text x="554" y="458" class="small muted">protocol 2</text><text x="355" y="481" text-anchor="middle" class="mono">lines [...]</text><line x1="536" y1="490" x2="174" y2="490" class="ln-accent" marker-end="url(#am-acc)"/></svg>
