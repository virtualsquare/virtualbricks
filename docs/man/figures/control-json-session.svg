<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 436" role="img" aria-label="A session of the JSON protocol: on a socket that asks for the token, Virtualbricks first asks for the proof and the client gives it; then the greeting; then the client sends two requests, one line each, and gets the two answers in the same order."><defs><marker id="tx-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip"/></marker><marker id="tx-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-accent"/></marker><marker id="tx-warn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-warn"/></marker></defs><rect x="115" y="16" width="110" height="34" rx="6" class="box"/><text x="170" y="38" text-anchor="middle" class="title">client</text><line x1="170" y1="50" x2="170" y2="424" class="life"/><rect x="468" y="16" width="145" height="34" rx="6" class="box"/><text x="540" y="38" text-anchor="middle" class="title">Virtualbricks</text><line x1="540" y1="50" x2="540" y2="424" class="life"/><text x="355" y="91" text-anchor="middle" class="mono">{&quot;protocol&quot;: 1, &quot;auth&quot;: &quot;token&quot;, &quot;nonce&quot;: S}</text><line x1="536" y1="100" x2="174" y2="100" class="ln-warn" marker-end="url(#tx-warn)"/><text x="554" y="108" class="small muted">on a socket that asks</text><text x="554" y="123" class="small muted">for the token</text><text x="355" y="145" text-anchor="middle" class="mono">{&quot;nonce&quot;: C, &quot;proof&quot;: ...}</text><line x1="174" y1="154" x2="536" y2="154" class="ln-warn" marker-end="url(#tx-warn)"/><text x="355" y="193" text-anchor="middle" class="mono">{&quot;protocol&quot;: 1, &quot;version&quot;: ..., &quot;pid&quot;: ...,</text><text x="355" y="209" text-anchor="middle" class="mono">&quot;project&quot;: ...[, &quot;proof&quot;: ...]}</text><line x1="536" y1="218" x2="174" y2="218" class="ln-accent" marker-end="url(#tx-acc)"/><text x="554" y="226" class="small muted">the greeting</text><text x="355" y="257" text-anchor="middle" class="mono">{&quot;line&quot;: &quot;brick start sw1&quot;}</text><line x1="174" y1="266" x2="536" y2="266" class="ln" marker-end="url(#tx-tip)"/><text x="355" y="297" text-anchor="middle" class="mono">{&quot;line&quot;: &quot;status&quot;}</text><line x1="174" y1="306" x2="536" y2="306" class="ln" marker-end="url(#tx-tip)"/><text x="554" y="314" class="small muted">a request may go</text><text x="554" y="329" class="small muted">before the answer</text><text x="355" y="351" text-anchor="middle" class="mono">{&quot;ok&quot;: true, &quot;lines&quot;: [...]}</text><line x1="536" y1="360" x2="174" y2="360" class="ln-accent" marker-end="url(#tx-acc)"/><text x="554" y="368" class="small muted">in the same order</text><text x="355" y="391" text-anchor="middle" class="mono">{&quot;ok&quot;: true, &quot;lines&quot;: [...]}</text><line x1="536" y1="400" x2="174" y2="400" class="ln-accent" marker-end="url(#tx-acc)"/></svg>
