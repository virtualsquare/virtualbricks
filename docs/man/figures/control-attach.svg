<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 276" role="img" aria-label="Attach: the program calls Attach with the brick and its console; Virtualbricks connects to the console of the brick, then answers. From then on the connection carries the bytes of the console both ways, and the windows join it to a terminal."><defs><marker id="at-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip"/></marker><marker id="at-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-accent"/></marker><marker id="at-warn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="tip-warn"/></marker></defs><rect x="35" y="16" width="110" height="34" rx="6" class="box"/><text x="90" y="38" text-anchor="middle" class="title">terminal</text><line x1="90" y1="50" x2="90" y2="264" class="life"/><rect x="215" y="16" width="110" height="34" rx="6" class="box"/><text x="270" y="38" text-anchor="middle" class="title">program</text><line x1="270" y1="50" x2="270" y2="264" class="life"/><rect x="408" y="16" width="145" height="34" rx="6" class="box"/><text x="480" y="38" text-anchor="middle" class="title">Virtualbricks</text><line x1="480" y1="50" x2="480" y2="264" class="life"/><rect x="615" y="16" width="110" height="34" rx="6" class="box"/><text x="670" y="38" text-anchor="middle" class="title">console</text><line x1="670" y1="50" x2="670" y2="264" class="life"/><text x="375" y="91" text-anchor="middle" class="mono">Attach brick vm1,</text><text x="375" y="107" text-anchor="middle" class="mono">console monitor</text><line x1="274" y1="116" x2="476" y2="116" class="ln" marker-end="url(#at-tip)"/><text x="575" y="147" text-anchor="middle" class="mono">connects</text><line x1="484" y1="156" x2="666" y2="156" class="ln" marker-end="url(#at-tip)"/><text x="375" y="187" text-anchor="middle" class="mono">answer</text><line x1="476" y1="196" x2="274" y2="196" class="ln-accent" marker-end="url(#at-acc)"/><line x1="96" y1="232" x2="264" y2="232" class="ln-bytes" marker-start="url(#at-acc)" marker-end="url(#at-acc)"/><text x="180" y="224" text-anchor="middle" class="mono small t-accent">bytes</text><line x1="276" y1="232" x2="474" y2="232" class="ln-bytes" marker-start="url(#at-acc)" marker-end="url(#at-acc)"/><text x="375" y="224" text-anchor="middle" class="mono small t-accent">bytes</text><line x1="486" y1="232" x2="664" y2="232" class="ln-bytes" marker-start="url(#at-acc)" marker-end="url(#at-acc)"/><text x="575" y="224" text-anchor="middle" class="mono small t-accent">bytes</text></svg>
