# The unit tests on the Python libraries of each supported distribution:
# its Python, and the versions of the Versions of WORKAROUNDS.md, installed
# from PyPI.
#
#     tox                                    every distribution
#     tox -e ubuntu-24.04                    one
#     tox -e debian-13 -- virtualbricks.tests.console.test_control
#
# The C libraries, GTK and GLib among them, are those of this computer:
# tools/targetsuite.py runs the tests in a container of each distribution,
# with all of its own packages.

[tox]
min_version = 4.67
env_list = ubuntu-24.04, debian-13, ubuntu-26.04, debian-testing

[testenv]
# the tests run on the sources; the package installs the dependencies
package = editable
# the deps hold for the dependencies of the package too: pip fails rather
# than install another version
constrain_package_deps = true
# the tests of the windows are skipped without a display; tox looks for
# base_python with these too, and the shims of pyenv find a Python of
# PYENV_VERSION, as pyenv shell sets it
pass_env =
    DISPLAY
    WAYLAND_DISPLAY
    XAUTHORITY
    XDG_RUNTIME_DIR
    PYENV_VERSION
commands =
    python -m twisted.trial -j8 --temp-directory {env_tmp_dir}/trial {posargs:virtualbricks}

[testenv:ubuntu-24.04]
base_python = python3.12
deps =
    PyGObject==3.48.2
    Twisted==24.3.0
    attrs==23.2.0
    markdown-it-py==3.0.0
    pyOpenSSL==23.2.0
    pygraphviz==1.7
    tomlkit==0.12.4
    zope.interface==6.1

[testenv:debian-13]
base_python = python3.13
deps =
    PyGObject==3.50.0
    Twisted==24.11.0
    attrs==25.3.0
    markdown-it-py==3.0.0
    pyOpenSSL==25.0.0
    pygraphviz==1.14
    tomlkit==0.13.2
    zope.interface==7.2

[testenv:ubuntu-26.04]
base_python = python3.14
deps =
    PyGObject==3.56.2
    Twisted==25.5.0
    attrs==25.4.0
    markdown-it-py==3.0.0
    pyOpenSSL==25.3.0
    pygraphviz==1.14
    tomlkit==0.13.3
    zope.interface==8.2

[testenv:debian-testing]
base_python = python3.14
deps =
    PyGObject==3.58.0
    Twisted==26.4.0
    attrs==26.1.0
    markdown-it-py==4.2.0
    pyOpenSSL==26.4.0
    pygraphviz==1.14
    tomlkit==0.13.3
    zope.interface==8.6
