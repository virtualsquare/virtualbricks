[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualbricks"
dynamic = ["version"]
description = "Virtualbricks Virtualization Tools"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Virtualbricks team" }]
license = "GPL-2.0-or-later"
license-files = ["COPYING", "LICENCE"]
requires-python = ">=3.10"
dependencies = [
    "pygraphviz>=1.7",
    # tls: pyOpenSSL and service-identity, for the ssl sockets
    "Twisted[tls]>=22.1",
    # the certificates of the ssl sockets, and of their clients: 21.0 is the
    # python3-openssl of Ubuntu 22.04, the oldest of Debian and Ubuntu
    "pyOpenSSL>=21.0",
    "attrs>=20.1",
    "markdown-it-py>=1.1",
    "zope.interface>=5.4",
    "PyGObject>=3.42",
    "tomli>=1.2; python_version < '3.11'",
    "tomlkit>=0.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
]

[dependency-groups]
test = ["coverage>=6.2"]
# the end-to-end tests, in e2e/
e2e = [
    "pytest>=7.0",
    "pytest-bdd>=8.0",
    "pytest-repeat>=0.9",
    "pytest-xdist>=3.0",
    # the results of --alluredir=, for the report of Allure
    "allure-pytest-bdd>=2.16",
]
dev = [
    { include-group = "test" },
    { include-group = "e2e" },
    "black>=26.5",
    "pre-commit>=4.0",
    # pandoc, for docs/man/build.py
    "pypandoc-binary==1.17",
    "pyflakes>=3.0",
    "ruff>=0.16",
    # the types; mypy-zope holds mypy to the versions it supports
    "mypy>=2.4",
    "mypy-zope>=1.0.17",
    # The types of the libraries: Twisted, attrs, tomlkit and tomli ship
    # theirs, mypy-zope has zope.interface's. There are none for pygraphviz.
    # The stubs are of GTK 4 unless PYGOBJECT_STUB_CONFIG=Gtk3,Gdk3 at their
    # install: see Setting up in README.md.
    "PyGObject-stubs>=2.17",
]
website = [
    { include-group = "dev" },
    "pelican[markdown]==4.11.0.post0",
]

[project.urls]
Homepage = "https://github.com/virtualsquare/virtualbricks"

[project.scripts]
virtualbricks = "virtualbricks.main:main"

[project.gui-scripts]
virtualbricks-migrate = "virtualbricks.migrate.cli:gui_main"

[tool.setuptools]
platforms = ["linux"]

[tool.setuptools.dynamic]
version = { attr = "virtualbricks.__version__" }

[tool.setuptools.packages.find]
include = ["virtualbricks*"]

[tool.setuptools.package-data]
"virtualbricks.gui" = ["data/*.png"]

[tool.setuptools.data-files]
"share/applications" = ["share/virtualbricks.desktop"]
