[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualbricks"
dynamic = ["version"]
description = "Virtualbricks Virtualization Tools"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Virtualbricks team" }]
license = "GPL-2.0-or-later"
license-files = ["COPYING", "LICENCE"]
requires-python = ">=3.10"
dependencies = [
    "pygraphviz>=1.7",
    # tls: pyOpenSSL and service-identity, for the ssl sockets
    "Twisted[tls]>=22.1",
    "attrs>=20.1",
    "markdown-it-py>=1.1",
    "zope.interface>=5.4",
    "PyGObject>=3.42",
    "tomli>=1.2; python_version < '3.11'",
    "tomlkit>=0.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
]

[dependency-groups]
test = ["coverage>=6.2"]
dev = [
    { include-group = "test" },
    "black>=26.5",
    "pre-commit>=4.0",
    # pandoc, for docs/man/build.py
    "pypandoc-binary==1.17",
    "pyflakes>=3.0",
    "ruff>=0.16",
    # The types of the libraries: Twisted, attrs, tomlkit and tomli ship
    # theirs. There are none for pygraphviz and zope.interface.
    "PyGObject-stubs>=2.17",
]

[project.urls]
Homepage = "https://github.com/virtualsquare/virtualbricks"

[project.scripts]
virtualbricks = "virtualbricks.scripts.virtualbricks:run"

[project.gui-scripts]
virtualbricks-migrate = "virtualbricks.migrate.cli:gui_main"

[tool.setuptools]
platforms = ["linux"]

[tool.setuptools.dynamic]
version = { attr = "virtualbricks.__version__" }

[tool.setuptools.packages.find]
include = ["virtualbricks*"]

[tool.setuptools.package-data]
"virtualbricks.gui" = ["data/*.png"]

[tool.setuptools.data-files]
"share/applications" = ["share/virtualbricks.desktop"]
"share/pixmaps" = ["share/virtualbricks.xpm"]
"share/man/man1" = ["docs/man/virtualbricks.1"]
"share/man/man5" = ["docs/man/virtualbricks-config.5"]
"share/man/man7" = ["docs/man/virtualbricks-archive.7"]
"share/locale/de/LC_MESSAGES" = ["locale/de/LC_MESSAGES/virtualbricks.mo"]
"share/locale/es/LC_MESSAGES" = ["locale/es/LC_MESSAGES/virtualbricks.mo"]
"share/locale/fr/LC_MESSAGES" = ["locale/fr/LC_MESSAGES/virtualbricks.mo"]
"share/locale/it/LC_MESSAGES" = ["locale/it/LC_MESSAGES/virtualbricks.mo"]
"share/locale/nl/LC_MESSAGES" = ["locale/nl/LC_MESSAGES/virtualbricks.mo"]

[tool.coverage.run]
branch = true
source = ["virtualbricks"]
omit = ["virtualbricks/tests/*", "virtualbricks/migrate/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["_trial_temp"]

[tool.ruff.lint]
# ruff's defaults (E4, E7, E9, F); formatting and line length are left to black
select = ["E4", "E7", "E9", "F"]
# gi.require_version() has to run before the gi.repository imports
ignore = ["E402"]
