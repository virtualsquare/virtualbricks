[tool.pytest.ini_options]
# pytest runs the end-to-end tests; trial runs the others
testpaths = ["e2e"]
addopts = "--alluredir=allure-results --numprocesses=8"

[tool.coverage.run]
branch = true
source = ["virtualbricks"]
omit = ["virtualbricks/tests/*", "virtualbricks/migrate/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["_trial_temp"]

[tool.ruff.lint]
# ruff's defaults (E4, E7, E9, F); formatting and line length are left to black
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# outside virtualbricks.gui, gi.require_version() has to run before the
# gi.repository import
"virtualbricks/migrate/gui.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["virtualbricks"]
# combine-as-imports = true

[tool.mypy]
# mypy alone checks these; the tests are left out
files = ["virtualbricks", "tools"]
exclude = ["^virtualbricks/tests/"]
python_version = "3.10"
# the interfaces of zope.interface and @implementer
plugins = ["mypy_zope:plugin"]
warn_unused_ignores = true
warn_redundant_casts = true
# every module is typed in full, and stays so
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# no types, no stubs
module = ["constantly", "pygraphviz", "pygraphviz.*"]
ignore_missing_imports = true
