[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualbricks"
dynamic = ["version"]
description = "Virtualbricks Virtualization Tools"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Virtualbricks team" }]
license = "GPL-2.0-or-later"
license-files = ["COPYING", "LICENCE"]
requires-python = ">=3.10"
dependencies = [
    "pygraphviz>=1.7",
    # tls: pyOpenSSL and service-identity, for the ssl sockets
    "Twisted[tls]>=22.1",
    "attrs>=20.1",
    "markdown-it-py>=1.1",
    "zope.interface>=5.4",
    "PyGObject>=3.42",
    "tomli>=1.2; python_version < '3.11'",
    "tomlkit>=0.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
]

[dependency-groups]
test = ["coverage>=6.2"]
# the end-to-end tests, in e2e/
e2e = [
    "pytest>=7.0",
    "pytest-bdd>=8.0",
    "pytest-repeat>=0.9",
    "pytest-xdist>=3.0",
    # the results of --alluredir=, for the report of Allure
    "allure-pytest-bdd>=2.16",
]
dev = [
    { include-group = "test" },
    { include-group = "e2e" },
    "black>=26.5",
    "pre-commit>=4.0",
    # pandoc, for docs/man/build.py
    "pypandoc-binary==1.17",
    "pyflakes>=3.0",
    "ruff>=0.16",
    # the types; mypy-zope holds mypy to the versions it supports
    "mypy>=2.4",
    "mypy-zope>=1.0.17",
    # The types of the libraries: Twisted, attrs, tomlkit and tomli ship
    # theirs, mypy-zope has zope.interface's. There are none for pygraphviz.
    # The stubs are of GTK 4 unless PYGOBJECT_STUB_CONFIG=Gtk3,Gdk3 at their
    # install: see Setting up in README.md.
    "PyGObject-stubs>=2.17",
]

[project.urls]
Homepage = "https://github.com/virtualsquare/virtualbricks"

[project.scripts]
virtualbricks = "virtualbricks.scripts.virtualbricks:run"

[project.gui-scripts]
virtualbricks-migrate = "virtualbricks.migrate.cli:gui_main"

[tool.setuptools]
platforms = ["linux"]

[tool.setuptools.dynamic]
version = { attr = "virtualbricks.__version__" }

[tool.setuptools.packages.find]
include = ["virtualbricks*"]

[tool.setuptools.package-data]
"virtualbricks.gui" = ["data/*.png"]

[tool.setuptools.data-files]
"share/applications" = ["share/virtualbricks.desktop"]
"share/pixmaps" = ["share/virtualbricks.xpm"]
"share/man/man1" = ["docs/man/virtualbricks.1"]
"share/man/man5" = ["docs/man/virtualbricks-config.5"]
"share/man/man7" = [
    "docs/man/virtualbricks-archive.7",
    "docs/man/virtualbricks-control.7",
]
"share/locale/de/LC_MESSAGES" = ["locale/de/LC_MESSAGES/virtualbricks.mo"]
"share/locale/es/LC_MESSAGES" = ["locale/es/LC_MESSAGES/virtualbricks.mo"]
"share/locale/fr/LC_MESSAGES" = ["locale/fr/LC_MESSAGES/virtualbricks.mo"]
"share/locale/it/LC_MESSAGES" = ["locale/it/LC_MESSAGES/virtualbricks.mo"]
"share/locale/nl/LC_MESSAGES" = ["locale/nl/LC_MESSAGES/virtualbricks.mo"]

[tool.pytest.ini_options]
# pytest runs the end-to-end tests; trial runs the others
testpaths = ["e2e"]
addopts = "--alluredir=allure-results --numprocesses=8"

[tool.coverage.run]
branch = true
source = ["virtualbricks"]
omit = ["virtualbricks/tests/*", "virtualbricks/migrate/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["_trial_temp"]

[tool.ruff.lint]
# ruff's defaults (E4, E7, E9, F); formatting and line length are left to black
select = ["E4", "E7", "E9", "F"]
# gi.require_version() has to run before the gi.repository imports
ignore = ["E402"]

[tool.mypy]
# mypy alone checks these; the tests are left out
files = ["virtualbricks", "tools"]
exclude = ["^virtualbricks/tests/"]
python_version = "3.10"
# the interfaces of zope.interface and @implementer
plugins = ["mypy_zope:plugin"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# no types, no stubs
module = ["pygraphviz", "pygraphviz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The modules typed in full stay so: add one when tools/typecoverage.py gives
# it 100%.
module = [
    "virtualbricks.bricks.*",
    "virtualbricks.config.*",
    "virtualbricks.console.*",
    "virtualbricks.engine",
    "virtualbricks.gui.form",
    "virtualbricks.gui.graphics",
    "virtualbricks.gui.imageinfo",
    "virtualbricks.gui.markdownview",
    "virtualbricks.gui.messages",
    "virtualbricks.gui.pango",
    "virtualbricks.gui.pathentry",
    "virtualbricks.gui.trash",
    "virtualbricks.i18n",
    "virtualbricks.ksm",
    "virtualbricks.locations",
    "virtualbricks.locks",
    "virtualbricks.markdown",
    "virtualbricks.migrate.*",
    "virtualbricks.nic",
    "virtualbricks.observable",
    "virtualbricks.programs",
    "virtualbricks.qemu.*",
    "virtualbricks.remote.*",
    "virtualbricks.settingsdraft",
    "virtualbricks.sudo",
    "virtualbricks.terminal",
    "virtualbricks.topology",
    "virtualbricks.vde",
    "typecoverage",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
